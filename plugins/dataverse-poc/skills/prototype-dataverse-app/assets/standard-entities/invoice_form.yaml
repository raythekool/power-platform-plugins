version: 1
# Asset standard (tabella `invoice`, source: standard). Vedi invoice_view.yaml per l'uso.
entity:
  logicalName: "{{prefix}}invoice_form"
  displayName: Fattura
  pageType: form
  dataverse:
    table:
      source: standard
      logicalName: invoice
      schemaName: Invoice
      displayName: Invoice
      displayCollectionName: Invoices
      primaryIdAttribute: invoiceid
      primaryNameAttribute: name
      ownershipType: UserOwned
      sourceUrl: https://learn.microsoft.com/dynamics365/developer/reference/entities/invoice
      reuseDecision:
        outcome: reuse-standard
        reason: Tabella standard della baseline Sales Hub, gia verificata.
tabs:
  - logicalName: "{{prefix}}generale"
    displayName: Generale
sections:
  - logicalName: "{{prefix}}invoice_dati_principali"
    displayName: Dati principali
    tab: "{{prefix}}generale"
    layout: repeat(2, 1fr)
    fields:
      - logicalName: "{{prefix}}invoice_name"
        displayName: Nome fattura
        control: text
        required: true
        dataverse:
          table: invoice
          column: name
          source: standard
          type: string
          requiredLevel: ApplicationRequired
      - logicalName: "{{prefix}}invoice_customerid"
        displayName: Cliente
        control: lookup
        dataverse:
          table: invoice
          column: customerid
          source: standard
          type: customer
          requiredLevel: SystemRequired
          targets: [account, contact]
      - logicalName: "{{prefix}}invoice_totalamount"
        displayName: Totale fattura
        control: money
        readOnly: true
        dataverse:
          table: invoice
          column: totalamount
          source: standard
          type: money
          requiredLevel: None
      - logicalName: "{{prefix}}invoice_duedate"
        displayName: Scadenza
        control: datetime
        dataverse:
          table: invoice
          column: duedate
          source: standard
          type: datetime
          requiredLevel: None
          format: DateOnly
          behavior: DateOnly
