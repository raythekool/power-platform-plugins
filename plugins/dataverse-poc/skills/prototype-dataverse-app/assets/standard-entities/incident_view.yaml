version: 1
# Asset standard (tabella `incident`, source: standard). Fonte: Microsoft Learn entity reference.
# Uso: vedi ../standard-entities/account_view.yaml.
entity:
  logicalName: "{{prefix}}case_view"
  displayName: Casi
  pageType: view
  dataverse:
    table:
      source: standard
      logicalName: incident
      schemaName: Incident
      displayName: Case
      displayCollectionName: Cases
      primaryIdAttribute: incidentid
      primaryNameAttribute: title
      ownershipType: UserOwned
      sourceUrl: https://learn.microsoft.com/dynamics365/developer/reference/entities/incident
      reuseDecision:
        outcome: reuse-standard
        reason: Tabella condivisa dalla baseline Sales Hub e Customer Service Hub, gia verificata.
  dataset: "{{prefix}}cases"
  targetForm: "{{prefix}}case_form"
  primaryColumn: title
