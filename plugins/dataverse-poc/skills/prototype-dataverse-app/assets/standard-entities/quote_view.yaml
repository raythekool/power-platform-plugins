version: 1
# Asset standard (tabella `quote`, source: standard). Fonte: Microsoft Learn entity reference.
# Uso: vedi ../standard-entities/account_view.yaml.
entity:
  logicalName: "{{prefix}}quote_view"
  displayName: Offerte
  pageType: view
  dataverse:
    table:
      source: standard
      logicalName: quote
      schemaName: Quote
      displayName: Quote
      displayCollectionName: Quotes
      primaryIdAttribute: quoteid
      primaryNameAttribute: name
      ownershipType: UserOwned
      sourceUrl: https://learn.microsoft.com/dynamics365/developer/reference/entities/quote
      reuseDecision:
        outcome: reuse-standard
        reason: Tabella standard della baseline Sales Hub, gia verificata.
  dataset: "{{prefix}}quotes"
  targetForm: "{{prefix}}quote_form"
  primaryColumn: name
