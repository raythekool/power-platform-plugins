version: 1
# Asset standard (tabella `salesorder`, source: standard). Fonte: Microsoft Learn entity reference.
# Uso: vedi ../standard-entities/account_view.yaml.
entity:
  logicalName: "{{prefix}}salesorder_view"
  displayName: Ordini
  pageType: view
  dataverse:
    table:
      source: standard
      logicalName: salesorder
      schemaName: SalesOrder
      displayName: Order
      displayCollectionName: Orders
      primaryIdAttribute: salesorderid
      primaryNameAttribute: name
      ownershipType: UserOwned
      sourceUrl: https://learn.microsoft.com/dynamics365/developer/reference/entities/salesorder
      reuseDecision:
        outcome: reuse-standard
        reason: Tabella standard della baseline Sales Hub, gia verificata.
  dataset: "{{prefix}}salesorders"
  targetForm: "{{prefix}}salesorder_form"
  primaryColumn: name
