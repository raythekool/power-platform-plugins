version: 1
# Asset standard (tabella `product`, source: standard). Fonte: Microsoft Learn entity reference.
# Uso: vedi ../standard-entities/account_view.yaml.
entity:
  logicalName: "{{prefix}}product_view"
  displayName: Prodotti
  pageType: view
  dataverse:
    table:
      source: standard
      logicalName: product
      schemaName: Product
      displayName: Product
      displayCollectionName: Products
      primaryIdAttribute: productid
      primaryNameAttribute: name
      ownershipType: OrganizationOwned
      sourceUrl: https://learn.microsoft.com/dynamics365/developer/reference/entities/product
      reuseDecision:
        outcome: reuse-standard
        reason: Tabella standard della baseline Sales Hub, gia verificata.
  dataset: "{{prefix}}products"
  targetForm: "{{prefix}}product_form"
  primaryColumn: name
