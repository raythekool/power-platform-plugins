version: 1
# Asset standard (tabella `template`, source: standard). Vedi template_view.yaml per l'uso.
entity:
  logicalName: "{{prefix}}template_form"
  displayName: Modello di messaggio e-mail
  pageType: form
  dataverse:
    table:
      source: standard
      logicalName: template
      schemaName: Template
      displayName: Email Template
      displayCollectionName: Email Templates
      primaryIdAttribute: templateid
      primaryNameAttribute: title
      ownershipType: OrganizationOwned
      sourceUrl: https://learn.microsoft.com/dynamics365/developer/reference/entities/template
      reuseDecision:
        outcome: reuse-standard
        reason: Tabella standard della baseline Customer Service Hub, gia verificata.
tabs:
  - logicalName: "{{prefix}}generale"
    displayName: Generale
sections:
  - logicalName: "{{prefix}}template_dati_principali"
    displayName: Dati principali
    tab: "{{prefix}}generale"
    layout: repeat(2, 1fr)
    fields:
      - logicalName: "{{prefix}}template_title"
        displayName: Titolo modello
        control: text
        required: true
        dataverse:
          table: template
          column: title
          source: standard
          type: string
          requiredLevel: ApplicationRequired
      - logicalName: "{{prefix}}template_subject"
        displayName: Oggetto
        control: text
        dataverse:
          table: template
          column: subject
          source: standard
          type: string
          requiredLevel: None
      - logicalName: "{{prefix}}template_templatetypecode"
        displayName: Tipo modello
        control: choice
        dataverse:
          table: template
          column: templatetypecode
          source: standard
          type: choice
          requiredLevel: None
          choice:
            - { value: 1, label: Account }
            - { value: 2, label: Contatto }
            - { value: 112, label: Caso }
