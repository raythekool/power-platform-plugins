<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" font-family="Segoe UI, system-ui, sans-serif">
  <title id="title">Architettura di dataverse-poc</title>
  <desc id="desc">L'utente parla con l'orchestratore, che esegue script deterministici e delega a dieci sotto-agenti; il risultato e un prototipo HTML/YAML e, in stage R, una solution in un ambiente DEV.</desc>
  <defs>
    <linearGradient id="orch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F6CBD"/><stop offset="1" stop-color="#5C2E91"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#F8FAFC"/>
  <!-- user -->
  <rect x="40" y="200" width="150" height="110" rx="16" fill="#fff" stroke="#E2E8F0"/>
  <text x="115" y="245" text-anchor="middle" font-size="30">🧑‍💼</text>
  <text x="115" y="280" text-anchor="middle" font-size="16" font-weight="600" fill="#0B1220">Tu</text>
  <text x="115" y="298" text-anchor="middle" font-size="12" fill="#475569">requisiti · conferme</text>
  <line x1="190" y1="255" x2="262" y2="255" stroke="#64748B" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <!-- orchestrator -->
  <rect x="265" y="190" width="250" height="130" rx="18" fill="url(#orch)"/>
  <text x="390" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Dataverse POC</text>
  <text x="390" y="262" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Orchestrator</text>
  <text x="390" y="292" text-anchor="middle" font-size="12" fill="#DBEAFE">piano · stage gate · brief · verifica</text>
  <!-- scripts layer -->
  <rect x="580" y="40" width="580" height="190" rx="18" fill="#E6F7F5" stroke="#9FDCD5"/>
  <text x="600" y="72" font-size="15" font-weight="700" fill="#0B5E56">Script deterministici · 0 token</text>
  <g font-size="13" fill="#0B1220">
    <rect x="600" y="90" width="170" height="40" rx="10" fill="#fff" stroke="#9FDCD5"/><text x="685" y="115" text-anchor="middle">check-prereqs</text>
    <rect x="780" y="90" width="170" height="40" rx="10" fill="#fff" stroke="#9FDCD5"/><text x="865" y="115" text-anchor="middle">poc-init</text>
    <rect x="960" y="90" width="180" height="40" rx="10" fill="#fff" stroke="#9FDCD5"/><text x="1050" y="115" text-anchor="middle">poc-add-standard</text>
    <rect x="600" y="145" width="170" height="40" rx="10" fill="#fff" stroke="#9FDCD5"/><text x="685" y="170" text-anchor="middle">npm run check</text>
    <rect x="780" y="145" width="170" height="40" rx="10" fill="#fff" stroke="#9FDCD5"/><text x="865" y="170" text-anchor="middle">poc-preflight</text>
    <rect x="960" y="145" width="180" height="40" rx="10" fill="#fff" stroke="#9FDCD5"/><text x="1050" y="170" text-anchor="middle">poc-solution-zip</text>
  </g>
  <text x="600" y="215" font-size="12" fill="#0B5E56">scaffold · validator · build · copertura · smoke test · preflight · verifica zip</text>
  <!-- agents layer -->
  <rect x="580" y="270" width="580" height="200" rx="18" fill="#EBF3FC" stroke="#B4D3F2"/>
  <text x="600" y="302" font-size="15" font-weight="700" fill="#0C3B5E">Sotto-agenti nascosti · giudizio e contenuti</text>
  <g font-size="12.5" fill="#0B1220">
    <rect x="600" y="318" width="132" height="34" rx="9" fill="#fff" stroke="#B4D3F2"/><text x="666" y="340" text-anchor="middle">prototype-builder</text>
    <rect x="740" y="318" width="132" height="34" rx="9" fill="#fff" stroke="#B4D3F2"/><text x="806" y="340" text-anchor="middle">datamodel</text>
    <rect x="880" y="318" width="132" height="34" rx="9" fill="#fff" stroke="#B4D3F2"/><text x="946" y="340" text-anchor="middle">demo-data</text>
    <rect x="1020" y="318" width="122" height="34" rx="9" fill="#fff" stroke="#B4D3F2"/><text x="1081" y="340" text-anchor="middle">forms-views</text>
    <rect x="600" y="362" width="132" height="34" rx="9" fill="#fff" stroke="#B4D3F2"/><text x="666" y="384" text-anchor="middle">genpage × N</text>
    <rect x="740" y="362" width="132" height="34" rx="9" fill="#fff" stroke="#B4D3F2"/><text x="806" y="384" text-anchor="middle">pcf</text>
    <rect x="880" y="362" width="132" height="34" rx="9" fill="#fff" stroke="#B4D3F2"/><text x="946" y="384" text-anchor="middle">webresources</text>
    <rect x="1020" y="362" width="122" height="34" rx="9" fill="#fff" stroke="#B4D3F2"/><text x="1081" y="384" text-anchor="middle">code-app</text>
    <rect x="600" y="406" width="132" height="34" rx="9" fill="#fff" stroke="#B4D3F2"/><text x="666" y="428" text-anchor="middle">tester</text>
    <rect x="740" y="406" width="132" height="34" rx="9" fill="#fff" stroke="#B4D3F2"/><text x="806" y="428" text-anchor="middle">deployer</text>
  </g>
  <text x="890" y="428" font-size="12" fill="#0C3B5E">brief autosufficiente → report standard</text>
  <path d="M515 230 C 545 200, 550 140, 578 135" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>
  <path d="M515 285 C 545 310, 550 360, 578 370" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>
  <!-- outputs -->
  <g font-size="13">
    <rect x="40" y="390" width="230" height="120" rx="16" fill="#fff" stroke="#E2E8F0"/>
    <text x="60" y="422" font-size="15" font-weight="700" fill="#0B1220">Stage P · prototipo</text>
    <text x="60" y="448" fill="#475569">YAML → HTML autosufficiente</text>
    <text x="60" y="468" fill="#475569">copertura requisiti</text>
    <text x="60" y="488" fill="#475569">componenti simulati con badge</text>
    <rect x="290" y="390" width="250" height="120" rx="16" fill="#fff" stroke="#E2E8F0"/>
    <text x="310" y="422" font-size="15" font-weight="700" fill="#0B1220">Stage R/D · ambiente DEV</text>
    <text x="310" y="448" fill="#475569">tabelle, form, viste, sitemap</text>
    <text x="310" y="468" fill="#475569">generative page, PCF, web resource</text>
    <text x="310" y="488" fill="#475569">solution, export, import</text>
  </g>
  <line x1="350" y1="322" x2="200" y2="386" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="322" x2="420" y2="386" stroke="#64748B" stroke-width="2" marker-end="url(#a)"/>
  <rect x="580" y="490" width="580" height="44" rx="12" fill="#FFF7E6" stroke="#F2D78B"/>
  <text x="600" y="518" font-size="13" fill="#6B5413">🛡️ hook poc-guard: conferma prima di cancellazioni, cambi di profilo o ambiente, import di solution</text>
</svg>
